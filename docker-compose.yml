x-api: &api
  build: .
  image: cinevault-api
  restart: unless-stopped
  volumes:
    - cinevault-data:/data
  depends_on:
    redis:
      condition: service_healthy

x-api-environment: &api-environment
  ConnectionStrings__Redis: redis:6379

services:
  redis:
    image: redis:7.4-alpine
    restart: unless-stopped
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save "" --appendonly no
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 2s
      retries: 30

  api1:
    <<: *api
    environment:
      <<: *api-environment
      INSTANCE_NAME: api1
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080"]
      interval: 2s
      timeout: 2s
      retries: 30

  api2:
    <<: *api
    environment:
      <<: *api-environment
      INSTANCE_NAME: api2
    depends_on:
      redis:
        condition: service_healthy
      api1:
        condition: service_healthy

  api3:
    <<: *api
    environment:
      <<: *api-environment
      INSTANCE_NAME: api3
    depends_on:
      redis:
        condition: service_healthy
      api1:
        condition: service_healthy

  lb:
    image: nginx:1.27-alpine
    ports:
      - "8080:80"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - api1
      - api2
      - api3

volumes:
  cinevault-data:
